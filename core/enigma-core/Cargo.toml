[package]
name = "enigma-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Enigma agentic-OS runtime core: scheduler, message bus, budgets, suspension, permissions"
repository = "https://github.com/7big1head4/vigilant-enigma"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "enigma"
path = "src/bin/enigma.rs"
