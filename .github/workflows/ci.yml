name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The Python bridge tests spawn a real worker process.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo fmt --all --check
        working-directory: core
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core

  rust-arm64:
    name: aarch64 check (RPi5 contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu

  python:
    name: SDK tests, dashboard check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
        working-directory: sdk/python
      - run: python -m py_compile dashboard/enigma_dash.py
      - run: python -m py_compile examples/agents.py
        env:
          PYTHONPATH: sdk/python
